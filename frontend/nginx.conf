server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/geo+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # font-src data: - Vite inlines very small font subsets as data: URIs
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.maps.eox.at https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org https://tiles.maps.eox.at; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://tiles.openfreemap.org; script-src 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /metrics {
        proxy_pass http://api:8000;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
