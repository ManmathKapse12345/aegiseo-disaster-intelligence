# Overrides for a single ARM64 server (e.g. Oracle Cloud Always Free Ampere A1):
#   docker compose -f docker-compose.yml -f deploy/oracle/docker-compose.oracle.yml up -d --build
services:
  db:
    image: aegis-postgis:16
    build:
      context: deploy/oracle
      dockerfile: db.Dockerfile

  api:
    environment:
      AEGIS_CORS_ORIGINS: https://${SITE_ADDRESS}

  web:
    ports: !reset []   # only reachable through Caddy

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
