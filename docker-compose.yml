# AegisEO full stack:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:-aegis-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${AEGIS_DB_PASSWORD:-aegis-dev-only}@db:5432/aegis
      AEGIS_CORS_ORIGINS: http://localhost:8080
    volumes:
      - aegis-data:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  aegis-data:
